name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - '.github/workflows/deploy-backend-cloudrun.yml'
  workflow_dispatch:

env:
  SERVICE: citylibrary
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env for Vite build
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_AUTH_API_URL=https://db-lwbwu263ra-uc.a.run.app" >> .env

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          source: .

      - name: Show deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"

  deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env for Vite build
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_AUTH_API_URL=https://db-dev-887210247628.us-central1.run.app" >> .env
          echo "VITE_AUTHORS_API_URL=https://db-dev-887210247628.us-central1.run.app" >> .env
          echo "VITE_AUTHORS_TABLE=authors_dev" >> .env
          echo "VITE_BOOKS_TABLE=books_dev" >> .env

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: citylibrary-dev
          region: ${{ env.REGION }}
          source: .

      - name: Show deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
